name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify GDScript formatting and lint
        run: python tools/run_gdscript_quality.py
      - name: Run repository static contracts
        run: python tools/validate_static.py
