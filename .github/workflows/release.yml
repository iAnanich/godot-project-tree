name: Build GitHub release candidate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve release refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('addons/script_dependency_inspector/plugin.cfg').read_text(encoding='utf-8')
          match = re.search(r'^version="([^"]+)"$', text, re.MULTILINE)
          if match is None:
              raise SystemExit('plugin.cfg has no version')
          print(match.group(1))
          PY
          )"
          test "$TAG" = "v$VERSION"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify required source gates
        run: |
          python tools/run_gdscript_quality.py
          python tools/validate_static.py
      - name: Build release archives twice
        run: |
          python tools/build_release.py --output dist-first
          python tools/build_release.py --output dist-second
          mkdir -p dist
          for first in dist-first/*.zip; do
            name="$(basename "$first")"
            cmp "$first" "dist-second/$name"
            cp "$first" "dist/$name"
          done
          cp dist-first/*SHA256SUMS.txt dist/
      - name: Verify release archive structure
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('addons/script_dependency_inspector/plugin.cfg').read_text(encoding='utf-8')
          print(re.search(r'^version="([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          python tools/verify_release_artifacts.py \
            --addon "dist/script-dependency-inspector-addon-v$VERSION.zip" \
            --project "dist/script-dependency-inspector-godot4-project-v$VERSION.zip" \
            --media "dist/script-dependency-inspector-asset-store-media-v$VERSION.zip"
      - name: Build patch from previous release
        if: steps.refs.outputs.previous_tag != ''
        run: >-
          python tools/build_patch.py
          --base-ref "${{ steps.refs.outputs.previous_tag }}"
          --target-ref "${{ steps.refs.outputs.tag }}"
          --output dist
      - name: Create draft GitHub release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.refs.outputs.tag }}"
          dist/*
          --draft
          --verify-tag
          --generate-notes
          --title "Script Dependency Inspector ${{ steps.refs.outputs.tag }}"
