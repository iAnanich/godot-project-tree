name: Build GitHub release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to package
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve release refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('addons/script_dependency_inspector/plugin.cfg').read_text(encoding='utf-8')
          print(re.search(r'^version="([^"]+)"$', text, re.MULTILINE).group(1))
          PY
          )"
          test "$TAG" = "v$VERSION"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
      - name: Install development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify formatting, lint, and static contracts
        run: |
          pre-commit run --all-files --show-diff-on-failure
          python tools/validate_static.py
      - name: Build source and add-on archives
        run: python tools/build_release.py --output dist
      - name: Build patch from previous release
        if: steps.refs.outputs.previous_tag != ''
        run: >-
          python tools/build_patch.py
          --base-ref "${{ steps.refs.outputs.previous_tag }}"
          --target-ref "${{ steps.refs.outputs.tag }}"
          --output dist
      - name: Create GitHub release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.refs.outputs.tag }}"
          dist/*
          --verify-tag
          --generate-notes
          --title "Script Dependency Inspector ${{ steps.refs.outputs.tag }}"
